<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline | KryptoProfík</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#07090e;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  .box{max-width:360px}
  .icon{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#10b981,#38bdf8,#a855f7);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px}
  h1{font-size:1.25rem;font-weight:900;margin:0 0 8px}
  p{color:#94a3b8;font-size:0.9rem;line-height:1.5;margin:0 0 20px}
  button{appearance:none;border:none;cursor:pointer;background:#10b981;color:#fff;font-weight:700;font-size:0.85rem;padding:10px 20px;border-radius:12px}
  button:hover{opacity:.9}
</style>
</head>
<body>
<div class="box">
  <div class="icon">📡</div>
  <h1>Jsi offline</h1>
  <p>Tuhle stránku se nepodařilo načíst, protože nemáš připojení k internetu a ještě není uložená v telefonu/počítači z předchozí návštěvy. Zkus to prosím znovu, až budeš online.</p>
  <button onclick="location.reload()">Zkusit znovu</button>
</div>
</body>
</html>
